# Authelia config for the bot's public self-hosted gateway (used by
# docker-compose.remote.yml). Rendered with the Go-template filter
# (X_AUTHELIA_CONFIG_FILTERS=template), so hostnames come from env vars set in the
# compose - you do NOT edit this file; set PUBLIC_HOST / AUTHELIA_HOST /
# COOKIE_DOMAIN in .env instead. Secrets come from *_FILE env vars and are
# intentionally absent here.

server:
  address: 'tcp://:9091/'

log:
  level: 'info'
  format: 'text'

# jwt_secret comes from AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE.
# Present but effectively unused (password reset is disabled below); harmless.
identity_validation:
  reset_password:
    jwt_lifespan: '5 minutes'
    jwt_algorithm: 'HS256'

authentication_backend:
  password_reset:
    disable: true          # single admin, no SMTP; reset by re-hashing via the CLI
  file:
    path: '/config/users_database.yml'
    watch: false
    search:
      email: false
      case_insensitive: false
    password:
      algorithm: 'argon2'
      argon2:
        variant: 'argon2id'
        iterations: 3
        memory: 65536
        parallelism: 4
        key_length: 32
        salt_length: 16

# Default deny; the admin Web-UI requires an admin login. The member routes
# /guild and /auth bypass this gate: they carry the bot's own Discord OAuth
# login and must stay reachable by guild members (first match wins, so the
# bypass rules sit above the admin rule). Static assets bypass too - the public
# /guild page loads them from root paths (same posture as ALLOWED_EXTENSIONS on
# the Yundera gateway); the pattern excludes '?' so a query string can never
# smuggle an extension past the gate (resources match path AND query). The
# factor count comes from setup.sh's MFA question:
# ACCESS_POLICY=two_factor|one_factor (compose defaults it to two_factor).
access_control:
  default_policy: 'deny'
  rules:
    - domain: '{{ env "PUBLIC_HOST" }}'
      policy: 'bypass'
      resources:
        - '^/guild([/?].*)?$'
        - '^/auth([/?].*)?$'
        - '^/[^?]*\.(js|jsx|css|png|ico|svg|jpg|jpeg|gif|woff|woff2|ttf|eot)$'
    - domain: '{{ env "PUBLIC_HOST" }}'
      policy: '{{ env "ACCESS_POLICY" }}'
      subject:
        - 'group:admins'

session:
  # session.secret comes from AUTHELIA_SESSION_SECRET_FILE.
  cookies:
    # COOKIE_DOMAIN must: (1) contain a dot and not be a public suffix, and (2) be the
    # registrable PARENT of PUBLIC_HOST and AUTHELIA_HOST (both sit under it, or the
    # browser won't share this cookie and login loops). It is the smdb. sub-level, so
    # the cookie never leaves that branch. sslip.io example:
    # COOKIE_DOMAIN=smdb.203-0-113-5.sslip.io with PUBLIC_HOST=bot.smdb.203-0-113-5.sslip.io
    # and AUTHELIA_HOST=auth.smdb.203-0-113-5.sslip.io. Real domain: smdb.example.com.
    - domain: '{{ env "COOKIE_DOMAIN" }}'
      authelia_url: 'https://{{ env "AUTH_HOST" }}'
      default_redirection_url: 'https://{{ env "PUBLIC_HOST" }}'
      name: 'authelia_session'
      same_site: 'lax'
      inactivity: '5m'
      expiration: '1h'
      remember_me: '1M'

regulation:
  modes:
    - 'user'
    - 'ip'
  max_retries: 3
  find_time: '2m'
  ban_time: '5m'

storage:
  # storage.encryption_key comes from AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE.
  local:
    path: '/data/db.sqlite3'

notifier:
  disable_startup_check: false
  filesystem:
    filename: '/data/notification.txt'   # in-UI one-time codes land here (manual path / fallback only; setup.sh provisions TOTP server-side)

totp:
  issuer: '{{ env "PUBLIC_HOST" }}'
